openapi: 3.1.0
info:
  title: PEM provider-service API
  version: 1.2.0
  description: 'provider-service (port 8081, database provider_db). Replaces: VSAM master + DB2 PROVIDER/PROVIDER_OWNER; status changes; PINQ
    lookup. Contract-first; status DRAFT until Phase 3 approval, then 1.0.0. 1.1.0 (2026-11-20, Q-131 A, user decision): AuditEntry before and after
    declare their members (ProviderSnapshot, with the parts AuditScreening, AuditRisk, AuditDecision, AuditStatusChange and AuditNotice) as the
    service returns them (MAM-40); additive, no member renamed or removed, no operation changed. 1.2.0 (2026-11-20, Q-132, user decision):
    searchProviders gets the optional query parameter afterNpi (keyset paging in ascending NPI order, for a caller that walks every match while the
    data may change, such as the T-MSIS extract) and states the ascending NPI order that MAM-37 AC-6 already requires; total keeps counting every
    match; additive: no operation added or removed, no member renamed, and a call without afterNpi answers exactly as in 1.1.0.'
  license:
    name: Proprietary
    identifier: LicenseRef-PEM-Proprietary
servers:
- url: http://api-gateway:8080
  description: 'API gateway on the docker compose network (from the host: http://localhost:8080)'
tags:
- name: Providers
  description: The provider golden record
- name: Approvals
  description: Analyst approval (D-019)
- name: Status
  description: Status changes from sanctions
- name: Audit
  description: Audit history
- name: Legacy files
  description: Fixed-width legacy files kept for parity (MODERNIZATION.md rule 3)
paths:
  /api/v1/providers:
    get:
      operationId: searchProviders
      summary: Search providers by NPI, Medicaid ID, name or status (replaces CICS PINQ)
      tags:
      - Providers
      description: 'Roles: ANALYST, SUPERVISOR, ADMIN, SYSTEM. Legacy / decisions: PRVCICS1 inquiry; work-queue filters; keyset paging Q-132
        (1.2.0). Every given filter must match. The items are in ascending NPI order, with or without afterNpi (MAM-37 AC-6). Two ways to page, never
        mixed in one call. (1) Offset paging, unchanged: page and size; a call without afterNpi answers exactly as in 1.1.0 (same results, same order,
        same paging). (2) Keyset paging (1.2.0): afterNpi and size; the answer holds only the providers whose NPI is greater than afterNpi, in
        ascending NPI order, at most size of them; page must be absent or 0 (any other page is a 400 problem) and the answer then has page 0. To walk
        every match: the first call has no afterNpi (page absent or 0); each next call repeats the same filters and size and sets afterNpi to the npi
        of the last item of the previous answer; the walk ends at the first answer whose items list is empty (an answer with fewer items than size
        is the last one that holds providers, so a caller may also stop there). Because the key only moves forward, a provider that matches the
        filters for the whole walk is returned exactly once, whatever changes elsewhere in the data during the walk. total is always the number of
        ALL providers that match the filters (npi, medicaidId, name, status, screenFlag), never only those after the key: it is the same on every
        answer of a walk while the data does not change, and a caller compares it between answers to notice a change (the Q-132 safety net).'
      x-roles: &id001
      - ANALYST
      - SUPERVISOR
      - ADMIN
      - SYSTEM
      x-legacy: PRVCICS1 inquiry; work-queue filters
      parameters:
      - name: npi
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
        description: Exact NPI
      - name: medicaidId
        in: query
        required: false
        schema:
          type: string
          maxLength: 9
        description: Exact Medicaid ID (the legacy alternate index)
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Name contains
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - P
          - A
          - T
          - D
          - S
        description: Enrolment status
      - name: screenFlag
        in: query
        required: false
        schema:
          type: string
          enum:
          - U
          - P
          - F
        description: Screen flag
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Page number (0-based). With afterNpi it must be absent or 0; any other page is a 400 problem.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: Page size (the same with or without afterNpi)
      - name: afterNpi
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: A position in NPI order (exactly 10 digits)
          examples:
          - '1003000444'
        description: 'Keyset paging (1.2.0, Q-132). Present: the answer holds only the providers whose NPI is greater than afterNpi, in ascending NPI
          order (10-digit NPIs compare the same as text and as numbers), at most size of them; every other filter combines with it; page must be
          absent or 0. The value need not be on file or match the filters: it is only a position (normally the npi of the last item of the previous
          answer). total still counts ALL providers that match the filters, not only those after the key. Absent: nothing changes, the answer is
          exactly as in 1.1.0. Strict input (lesson b of the code reviews): a value that is not exactly 10 digits (empty, shorter, longer, letters, a
          sign, spaces or other padding) or afterNpi given more than once is a 400 problem, never coerced and never ignored.'
      security:
      - bearerAuth: *id001
      responses:
        '200':
          description: 'OK. Without afterNpi: page page of the matches in ascending NPI order. With afterNpi: up to size matches whose NPI is greater
            than afterNpi, in ascending NPI order, and page 0; an empty items list means there is nothing after the key (the end of a walk). In both,
            total is the number of all matches of the filters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPage'
        '400':
          description: 'Invalid request: a malformed filter or paging value (npi, medicaidId, status, screenFlag, page, size, afterNpi; afterNpi not
            exactly 10 digits or given more than once), or afterNpi together with a page other than 0.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{npi}:
    get:
      operationId: getProvider
      summary: Get one provider record (all PRVRECRD fields)
      tags:
      - Providers
      description: 'Roles: PROVIDER, ANALYST, SUPERVISOR, ADMIN, SYSTEM. Legacy / decisions: PRVCICS1 READ PRVPROVN; a PROVIDER sees only their
        own record.'
      x-roles: &id002
      - PROVIDER
      - ANALYST
      - SUPERVISOR
      - ADMIN
      - SYSTEM
      x-legacy: PRVCICS1 READ PRVPROVN; a PROVIDER sees only their own record
      parameters:
      - name: npi
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
      security:
      - bearerAuth: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{npi}/approval:
    post:
      operationId: decideProvider
      summary: Approve (ACTIVE, due date = approval + 5 years) or deny (DENIED) a pending provider whose screening passed
      tags:
      - Approvals
      description: 'Roles: ANALYST, SUPERVISOR. Legacy / decisions: D-019, D-003.'
      x-roles: &id003
      - ANALYST
      - SUPERVISOR
      x-legacy: D-019, D-003
      parameters:
      - name: npi
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      security:
      - bearerAuth: *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict with the current state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Business validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{npi}/status-changes:
    post:
      operationId: changeProviderStatus
      summary: Apply a sanction status change (terminate, suspend, reinstate)
      tags:
      - Status
      description: 'Roles: SYSTEM, SUPERVISOR. Legacy / decisions: PRVSAN01 APPLY-SANCTION; D-006, D-013.'
      x-roles: &id004
      - SYSTEM
      - SUPERVISOR
      x-legacy: PRVSAN01 APPLY-SANCTION; D-006, D-013
      parameters:
      - name: npi
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      security:
      - bearerAuth: *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Business validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{npi}/audit:
    get:
      operationId: getProviderAudit
      summary: Audit history of a provider (every state change)
      tags:
      - Audit
      description: 'Roles: SUPERVISOR, ADMIN. Legacy / decisions: new (audit log).'
      x-roles: &id005
      - SUPERVISOR
      - ADMIN
      x-legacy: new (audit log)
      parameters:
      - name: npi
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Page number (0-based)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: Page size
      security:
      - bearerAuth: *id005
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/legacy/provider-master:
    get:
      operationId: exportProviderMaster
      summary: Export the provider master as 130-byte PRVRECRD records (Phase 9 parity)
      tags:
      - Legacy files
      description: 'Roles: ADMIN. Legacy / decisions: VSAM master; D-007.'
      x-roles: &id006
      - ADMIN
      x-legacy: VSAM master; D-007
      security:
      - bearerAuth: *id006
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                description: 130-byte fixed-width PRVRECRD records, one per line
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak realm pem access token. Role names in each operation's security requirement are realm roles (OpenAPI 3.1 allows role
        lists for non-OAuth schemes).
  schemas:
    ApprovalRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - DENY
        reason:
          type: string
          maxLength: 200
      description: 'D-019: an analyst approval sets ACTIVE after a PASS screening.'
    AuditDecision:
      type: object
      description: 'Part of after in an APPROVED or DENIED entry (MAM-40, 1.1.0): the decision as sent to decideProvider. Both members are always
        written; reason is null when none was sent.'
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - DENY
        reason:
          type:
          - string
          - 'null'
          maxLength: 200
    AuditEntry:
      type: object
      description: 'One entry of the provider history (MAM-40, D-018). actor is the user, or the producing service for an event. action is one of
        REGISTERED, SCREENING_VERDICT, RISK_TIER_ASSIGNED, APPROVED, DENIED, TERMINATED, SUSPENDED, REINSTATED, REVALIDATION_PASSED, NOTICE_SENT.
        before and after are ProviderSnapshot (members declared in 1.1.0, Q-131 A). correlationId is absent when the request or event had none
        that is a uuid.'
      required:
      - at
      - actor
      - action
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        before:
          $ref: '#/components/schemas/ProviderSnapshot'
        after:
          $ref: '#/components/schemas/ProviderSnapshot'
        correlationId: &id010
          type: string
          format: uuid
    AuditNotice:
      type: object
      description: 'The only member of after in a NOTICE_SENT entry (MAM-40 AC-4, D-012, 1.1.0): the notice id and template of the NoticeSent event,
        as received.'
      required:
      - noticeId
      - template
      properties:
        noticeId:
          type: string
          format: uuid
        template:
          type: string
    AuditPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    AuditRisk:
      type: object
      description: 'Part of after in a RISK_TIER_ASSIGNED entry (MAM-40, 1.1.0): the tier of the RiskTierAssigned event, as received.'
      required:
      - tier
      properties:
        tier:
          type: string
          enum:
          - L
          - M
          - H
    AuditScreening:
      type: object
      description: 'Part of after in a SCREENING_VERDICT entry (MAM-40, 1.1.0): the result of the ScreeningCompleted event, as received.'
      required:
      - result
      properties:
        result:
          type: string
          enum:
          - PASS
          - FAIL
    AuditStatusChange:
      type: object
      description: 'Part of after in a TERMINATED, SUSPENDED or REINSTATED entry (MAM-40 AC-5, 1.1.0): the StatusChangeRequest as applied. All four
        members are always written; reason and sanctionId are null when none was sent.'
      required:
      - action
      - reason
      - effectiveDate
      - sanctionId
      properties:
        action:
          type: string
          enum:
          - TERMINATE
          - SUSPEND
          - REINSTATE
        reason:
          type:
          - string
          - 'null'
          maxLength: 60
        effectiveDate:
          type: string
          format: date
        sanctionId:
          type:
          - string
          - 'null'
          format: uuid
    FieldError:
      type: object
      required:
      - code
      - field
      properties:
        code:
          type: string
          enum: &id007
          - E101
          - E102
          - E103
          - E104
          - E201
          - E202
          - E203
          - E204
          - E205
        field:
          type: string
        message:
          type: string
    Individual:
      type: object
      description: PRV-INDIVIDUAL-DATA view of PRV-VARIANT (provider type IN).
      properties:
        lastName:
          type: string
          maxLength: 30
        firstName:
          type: string
          maxLength: 20
        licenseNo:
          type: string
          maxLength: 15
        licenseState:
          type: string
          minLength: 2
          maxLength: 2
    Organization:
      type: object
      description: PRV-ORG-DATA view of PRV-VARIANT (provider type GR or FA).
      properties:
        legalName:
          type: string
          maxLength: 60
        dbaName:
          type: string
          maxLength: 30
        ownerNpi: &id008
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
    Problem:
      type: object
      description: RFC 7807 problem details. `code` carries a legacy error code (E101-E205) where one applies (D-016).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: *id007
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    Provider:
      type: object
      required:
      - npi
      - medicaidId
      - providerType
      - taxonomy
      - enrollStatus
      - screenFlag
      - effectiveDate
      properties:
        npi: *id008
        medicaidId:
          type: string
          maxLength: 9
        providerType:
          type: string
          enum:
          - IN
          - GR
          - FA
          description: IN individual, GR group, FA facility (D-008)
        taxonomy:
          type: string
          maxLength: 10
        riskTier:
          type:
          - string
          - 'null'
          enum:
          - L
          - M
          - H
          - null
        enrollStatus:
          type: string
          enum:
          - P
          - A
          - T
          - D
          - S
          description: P pending, A active, T terminated, D denied, S suspended (D-006)
        screenFlag:
          type: string
          enum:
          - U
          - P
          - F
        effectiveDate: &id009
          type: string
          format: date
        endDate:
          type:
          - string
          - 'null'
          format: date
        revalidationDueDate:
          type:
          - string
          - 'null'
          format: date
          description: Set at approval and at each completed revalidation (D-003); 4-digit years (D-004)
        individual:
          $ref: '#/components/schemas/Individual'
        organization:
          $ref: '#/components/schemas/Organization'
        version:
          type: integer
    ProviderPage:
      type: object
      description: One answer of searchProviders. The items are in ascending NPI order (MAM-37 AC-6).
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        page:
          type: integer
          minimum: 0
          description: The page asked for; 0 with afterNpi (keyset paging, 1.2.0)
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: The number of ALL providers that match the filters, with or without afterNpi (never only those after the key, Q-132)
    ProviderSnapshot:
      type:
      - object
      - 'null'
      description: 'The provider record as written to audit_log before or after one change (MAM-40; members declared in 1.1.0, Q-131 A). Null for
        before in REGISTERED and NOTICE_SENT entries. A snapshot of the record carries all eleven provider members, nulls included; after also
        carries the one part named for its action: screening (SCREENING_VERDICT), risk (RISK_TIER_ASSIGNED), decision (APPROVED, DENIED) or
        statusChange (TERMINATED, SUSPENDED, REINSTATED); REVALIDATION_PASSED has no part. The after of NOTICE_SENT carries only notice. No member
        is required because no member is in every entry. The schema itself admits null so that before and after can reference it directly.'
      properties:
        npi:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
        medicaidId:
          type: string
          maxLength: 9
        providerType:
          type: string
          enum:
          - IN
          - GR
          - FA
        taxonomy:
          type: string
          maxLength: 10
        riskTier:
          type:
          - string
          - 'null'
          enum:
          - L
          - M
          - H
          - null
        enrollStatus:
          type: string
          enum:
          - P
          - A
          - T
          - D
          - S
        screenFlag:
          type: string
          enum:
          - U
          - P
          - F
        effectiveDate:
          type: string
          format: date
        endDate:
          type:
          - string
          - 'null'
          format: date
        revalidationDueDate:
          type:
          - string
          - 'null'
          format: date
        version:
          type: integer
        screening:
          $ref: '#/components/schemas/AuditScreening'
        risk:
          $ref: '#/components/schemas/AuditRisk'
        decision:
          $ref: '#/components/schemas/AuditDecision'
        statusChange:
          $ref: '#/components/schemas/AuditStatusChange'
        notice:
          $ref: '#/components/schemas/AuditNotice'
    StatusChangeRequest:
      type: object
      required:
      - action
      - effectiveDate
      properties:
        action:
          type: string
          enum:
          - TERMINATE
          - SUSPEND
          - REINSTATE
          description: Legacy SANCIN T, S, R. Applied whatever the current status (D-027, Q-006).
        reason:
          type: string
          maxLength: 60
        effectiveDate: *id009
        sanctionId: *id010
