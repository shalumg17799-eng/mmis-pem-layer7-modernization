openapi: 3.1.0
info:
  title: PEM provider-service API
  version: 1.0.0
  description: 'provider-service (port 8081, database provider_db). Replaces: VSAM master + DB2 PROVIDER/PROVIDER_OWNER; status changes; PINQ
    lookup. Contract-first; status DRAFT until Phase 3 approval, then 1.0.0.'
  license:
    name: Proprietary
    identifier: LicenseRef-PEM-Proprietary
servers:
- url: http://api-gateway:8080
  description: 'API gateway on the docker compose network (from the host: http://localhost:8080)'
tags:
- name: Providers
  description: The provider golden record
- name: Approvals
  description: Analyst approval (D-019)
- name: Status
  description: Status changes from sanctions
- name: Audit
  description: Audit history
- name: Legacy files
  description: Fixed-width legacy files kept for parity (MODERNIZATION.md rule 3)
paths:
  /api/v1/providers:
    get:
      operationId: searchProviders
      summary: Search providers by NPI, Medicaid ID, name or status (replaces CICS PINQ)
      tags:
      - Providers
      description: 'Roles: ANALYST, SUPERVISOR, ADMIN, SYSTEM. Legacy / decisions: PRVCICS1 inquiry; work-queue filters.'
      x-roles: &id001
      - ANALYST
      - SUPERVISOR
      - ADMIN
      - SYSTEM
      x-legacy: PRVCICS1 inquiry; work-queue filters
      parameters:
      - name: npi
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
        description: Exact NPI
      - name: medicaidId
        in: query
        required: false
        schema:
          type: string
          maxLength: 9
        description: Exact Medicaid ID (the legacy alternate index)
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Name contains
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - P
          - A
          - T
          - D
          - S
        description: Enrolment status
      - name: screenFlag
        in: query
        required: false
        schema:
          type: string
          enum:
          - U
          - P
          - F
        description: Screen flag
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Page number (0-based)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: Page size
      security:
      - bearerAuth: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPage'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{npi}:
    get:
      operationId: getProvider
      summary: Get one provider record (all PRVRECRD fields)
      tags:
      - Providers
      description: 'Roles: PROVIDER, ANALYST, SUPERVISOR, ADMIN, SYSTEM. Legacy / decisions: PRVCICS1 READ PRVPROVN; a PROVIDER sees only their
        own record.'
      x-roles: &id002
      - PROVIDER
      - ANALYST
      - SUPERVISOR
      - ADMIN
      - SYSTEM
      x-legacy: PRVCICS1 READ PRVPROVN; a PROVIDER sees only their own record
      parameters:
      - name: npi
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
      security:
      - bearerAuth: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{npi}/approval:
    post:
      operationId: decideProvider
      summary: Approve (ACTIVE, due date = approval + 5 years) or deny (DENIED) a pending provider whose screening passed
      tags:
      - Approvals
      description: 'Roles: ANALYST, SUPERVISOR. Legacy / decisions: D-019, D-003.'
      x-roles: &id003
      - ANALYST
      - SUPERVISOR
      x-legacy: D-019, D-003
      parameters:
      - name: npi
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      security:
      - bearerAuth: *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict with the current state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Business validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{npi}/status-changes:
    post:
      operationId: changeProviderStatus
      summary: Apply a sanction status change (terminate, suspend, reinstate)
      tags:
      - Status
      description: 'Roles: SYSTEM, SUPERVISOR. Legacy / decisions: PRVSAN01 APPLY-SANCTION; D-006, D-013.'
      x-roles: &id004
      - SYSTEM
      - SUPERVISOR
      x-legacy: PRVSAN01 APPLY-SANCTION; D-006, D-013
      parameters:
      - name: npi
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      security:
      - bearerAuth: *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Business validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{npi}/audit:
    get:
      operationId: getProviderAudit
      summary: Audit history of a provider (every state change)
      tags:
      - Audit
      description: 'Roles: SUPERVISOR, ADMIN. Legacy / decisions: new (audit log).'
      x-roles: &id005
      - SUPERVISOR
      - ADMIN
      x-legacy: new (audit log)
      parameters:
      - name: npi
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Page number (0-based)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: Page size
      security:
      - bearerAuth: *id005
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/legacy/provider-master:
    get:
      operationId: exportProviderMaster
      summary: Export the provider master as 130-byte PRVRECRD records (Phase 9 parity)
      tags:
      - Legacy files
      description: 'Roles: ADMIN. Legacy / decisions: VSAM master; D-007.'
      x-roles: &id006
      - ADMIN
      x-legacy: VSAM master; D-007
      security:
      - bearerAuth: *id006
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                description: 130-byte fixed-width PRVRECRD records, one per line
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak realm pem access token. Role names in each operation's security requirement are realm roles (OpenAPI 3.1 allows role
        lists for non-OAuth schemes).
  schemas:
    ApprovalRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - DENY
        reason:
          type: string
          maxLength: 200
      description: 'D-019: an analyst approval sets ACTIVE after a PASS screening.'
    AuditEntry:
      type: object
      required:
      - at
      - actor
      - action
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        before:
          type:
          - object
          - 'null'
        after:
          type:
          - object
          - 'null'
        correlationId: &id010
          type: string
          format: uuid
    AuditPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    FieldError:
      type: object
      required:
      - code
      - field
      properties:
        code:
          type: string
          enum: &id007
          - E101
          - E102
          - E103
          - E104
          - E201
          - E202
          - E203
          - E204
          - E205
        field:
          type: string
        message:
          type: string
    Individual:
      type: object
      description: PRV-INDIVIDUAL-DATA view of PRV-VARIANT (provider type IN).
      properties:
        lastName:
          type: string
          maxLength: 30
        firstName:
          type: string
          maxLength: 20
        licenseNo:
          type: string
          maxLength: 15
        licenseState:
          type: string
          minLength: 2
          maxLength: 2
    Organization:
      type: object
      description: PRV-ORG-DATA view of PRV-VARIANT (provider type GR or FA).
      properties:
        legalName:
          type: string
          maxLength: 60
        dbaName:
          type: string
          maxLength: 30
        ownerNpi: &id008
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
    Problem:
      type: object
      description: RFC 7807 problem details. `code` carries a legacy error code (E101-E205) where one applies (D-016).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: *id007
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    Provider:
      type: object
      required:
      - npi
      - medicaidId
      - providerType
      - taxonomy
      - enrollStatus
      - screenFlag
      - effectiveDate
      properties:
        npi: *id008
        medicaidId:
          type: string
          maxLength: 9
        providerType:
          type: string
          enum:
          - IN
          - GR
          - FA
          description: IN individual, GR group, FA facility (D-008)
        taxonomy:
          type: string
          maxLength: 10
        riskTier:
          type:
          - string
          - 'null'
          enum:
          - L
          - M
          - H
          - null
        enrollStatus:
          type: string
          enum:
          - P
          - A
          - T
          - D
          - S
          description: P pending, A active, T terminated, D denied, S suspended (D-006)
        screenFlag:
          type: string
          enum:
          - U
          - P
          - F
        effectiveDate: &id009
          type: string
          format: date
        endDate:
          type:
          - string
          - 'null'
          format: date
        revalidationDueDate:
          type:
          - string
          - 'null'
          format: date
          description: Set at approval and at each completed revalidation (D-003); 4-digit years (D-004)
        individual:
          $ref: '#/components/schemas/Individual'
        organization:
          $ref: '#/components/schemas/Organization'
        version:
          type: integer
    ProviderPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    StatusChangeRequest:
      type: object
      required:
      - action
      - effectiveDate
      properties:
        action:
          type: string
          enum:
          - TERMINATE
          - SUSPEND
          - REINSTATE
          description: Legacy SANCIN T, S, R. Applied whatever the current status (D-027, Q-006).
        reason:
          type: string
          maxLength: 60
        effectiveDate: *id009
        sanctionId: *id010
