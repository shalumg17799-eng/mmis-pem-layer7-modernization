openapi: 3.1.0
info:
  title: PEM tmsis-service API
  version: 1.0.0
  description: 'tmsis-service (port 8089, database tmsis_db). Replaces: PRVTMS01 / PRVMTH01 STEP020-030. Contract-first; status DRAFT until Phase
    3 approval, then 1.0.0.'
  license:
    name: Proprietary
    identifier: LicenseRef-PEM-Proprietary
servers:
- url: http://api-gateway:8080
  description: 'API gateway on the docker compose network (from the host: http://localhost:8080)'
tags:
- name: Extracts
  description: T-MSIS extract runs
paths:
  /api/v1/batch/tmsis-extracts:
    post:
      operationId: startTmsisExtract
      summary: Produce the T-MSIS provider extract for a business date and archive it
      tags:
      - Extracts
      description: 'Roles: ADMIN, SYSTEM. Legacy / decisions: PRVMTH01 STEP020-030; D-015, Q-007.'
      x-roles: &id001
      - ADMIN
      - SYSTEM
      x-legacy: PRVMTH01 STEP020-030; D-015, Q-007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRunRequest'
      security:
      - bearerAuth: *id001
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRun'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listTmsisExtracts
      summary: List T-MSIS extract runs and archive generations
      tags:
      - Extracts
      description: 'Roles: ADMIN. Legacy / decisions: GDG MMPRV.TMSIS.ARCHIVE.'
      x-roles: &id002
      - ADMIN
      x-legacy: GDG MMPRV.TMSIS.ARCHIVE
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Page number (0-based)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: Page size
      security:
      - bearerAuth: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRunPage'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/batch/tmsis-extracts/{runId}/file:
    get:
      operationId: getTmsisExtractFile
      summary: Download the TMSISOUT file of a run (120-byte records)
      tags:
      - Extracts
      description: 'Roles: ADMIN. Legacy / decisions: TMSISOUT.'
      x-roles: &id003
      - ADMIN
      x-legacy: TMSISOUT
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Run id
      security:
      - bearerAuth: *id003
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                description: 120-byte TMSISOUT records
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak realm pem access token. Role names in each operation's security requirement are realm roles (OpenAPI 3.1 allows role
        lists for non-OAuth schemes).
  schemas:
    BatchRun:
      type: object
      required:
      - runId
      - job
      - businessDate
      - status
      properties:
        runId:
          type: string
          format: uuid
        job:
          type: string
        businessDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - FAILED
        counts:
          type: object
          additionalProperties:
            type: integer
        error:
          type:
          - string
          - 'null'
          description: Why the run failed (D-024)
        startedAt:
          type: string
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
    BatchRunPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchRun'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    BatchRunRequest:
      type: object
      required:
      - businessDate
      properties:
        businessDate:
          type: string
          format: date
          description: Explicit business date (D-020)
    FieldError:
      type: object
      required:
      - code
      - field
      properties:
        code:
          type: string
          enum: &id004
          - E101
          - E102
          - E103
          - E104
          - E201
          - E202
          - E203
          - E204
          - E205
        field:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 7807 problem details. `code` carries a legacy error code (E101-E205) where one applies (D-016).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: *id004
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
