openapi: 3.1.0
info:
  title: PEM revalidation-service API
  version: 1.1.0
  description: 'revalidation-service (port 8085, database revalidation_db). Replaces: PRVREV01 / PRVMTH01 STEP010. Contract-first; status DRAFT
    until Phase 3 approval, then 1.0.0. 1.1.0 (2026-11-19, user decision): adds GET /api/v1/batch/revalidation-sweeps/{runId} (run status, BatchRun) so the batch jobs page can follow a run to COMPLETED or FAILED; additive.'
  license:
    name: Proprietary
    identifier: LicenseRef-PEM-Proprietary
servers:
- url: http://api-gateway:8080
  description: 'API gateway on the docker compose network (from the host: http://localhost:8080)'
tags:
- name: Revalidations
  description: Revalidation cases
- name: Legacy files
  description: Fixed-width legacy files kept for parity (MODERNIZATION.md rule 3)
paths:
  /api/v1/revalidations:
    get:
      operationId: listRevalidationCases
      summary: List revalidation cases (work queue)
      tags:
      - Revalidations
      description: 'Roles: ANALYST, SUPERVISOR. Legacy / decisions: REVALQ; D-029.'
      x-roles: &id001
      - ANALYST
      - SUPERVISOR
      x-legacy: REVALQ; D-029
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DUE
          - IN_SCREENING
          - COMPLETED
          - CANCELLED
        description: Status
      - name: npi
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
        description: NPI
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Page number (0-based)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: Page size
      security:
      - bearerAuth: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevalidationCasePage'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/revalidations/{caseId}/completion:
    post:
      operationId: completeRevalidation
      summary: Complete a revalidation case with its screening result
      tags:
      - Revalidations
      description: 'Roles: SYSTEM, ANALYST. Legacy / decisions: D-003.'
      x-roles: &id002
      - SYSTEM
      - ANALYST
      x-legacy: D-003
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Case id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
      security:
      - bearerAuth: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevalidationCase'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict with the current state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/batch/revalidation-sweeps:
    post:
      operationId: startRevalidationSweep
      summary: Run the revalidation sweep for a business date
      tags:
      - Legacy files
      description: 'Roles: ADMIN, SYSTEM. Legacy / decisions: PRVMTH01 STEP010.'
      x-roles: &id003
      - ADMIN
      - SYSTEM
      x-legacy: PRVMTH01 STEP010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRunRequest'
      security:
      - bearerAuth: *id003
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRun'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/batch/revalidation-sweeps/{runId}:
    get:
      operationId: getRevalidationSweep
      summary: Get a revalidation sweep run with its status, counts and failure reason
      tags:
      - Legacy files
      description: 'Roles: ADMIN. Legacy / decisions: PRVREV01 counters (MAM-45, question C-8). Added in 1.1.0 (user decision 2026-11-19): run status for the batch jobs page (MAM-93).'
      x-roles:
      - ADMIN
      x-legacy: PRVREV01 counters (MAM-45, question C-8)
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Run id
      security:
      - bearerAuth:
        - ADMIN
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRun'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/batch/revalidation-sweeps/{runId}/queue-file:
    get:
      operationId: getRevalidationQueueFile
      summary: Download the REVALQ file of a sweep (80-byte records)
      tags:
      - Legacy files
      description: 'Roles: ADMIN. Legacy / decisions: REVALQ.'
      x-roles: &id004
      - ADMIN
      x-legacy: REVALQ
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Run id
      security:
      - bearerAuth: *id004
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                description: 80-byte REVALQ records
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak realm pem access token. Role names in each operation's security requirement are realm roles (OpenAPI 3.1 allows role
        lists for non-OAuth schemes).
  schemas:
    BatchRun:
      type: object
      required:
      - runId
      - job
      - businessDate
      - status
      properties:
        runId: &id005
          type: string
          format: uuid
        job:
          type: string
        businessDate: &id007
          type: string
          format: date
        status:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - FAILED
        counts:
          type: object
          additionalProperties:
            type: integer
        error:
          type:
          - string
          - 'null'
          description: Why the run failed (D-024)
        startedAt: &id008
          type: string
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
    BatchRunRequest:
      type: object
      required:
      - businessDate
      properties:
        businessDate:
          type: string
          format: date
          description: Explicit business date (D-020)
    CompletionRequest:
      type: object
      required:
      - screeningId
      - result
      properties:
        screeningId: *id005
        result:
          type: string
          enum:
          - PASS
          - FAIL
    FieldError:
      type: object
      required:
      - code
      - field
      properties:
        code:
          type: string
          enum: &id006
          - E101
          - E102
          - E103
          - E104
          - E201
          - E202
          - E203
          - E204
          - E205
        field:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 7807 problem details. `code` carries a legacy error code (E101-E205) where one applies (D-016).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: *id006
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    RevalidationCase:
      type: object
      required:
      - caseId
      - npi
      - dueDate
      - status
      properties:
        caseId: *id005
        npi:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
        dueDate: *id007
        status:
          type: string
          enum:
          - DUE
          - IN_SCREENING
          - COMPLETED
          - CANCELLED
        openedAt: *id008
        closedAt:
          type:
          - string
          - 'null'
          format: date-time
    RevalidationCasePage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RevalidationCase'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
