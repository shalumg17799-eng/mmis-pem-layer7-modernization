openapi: 3.1.0
info:
  title: PEM directory-service API
  version: 1.1.0
  description: 'directory-service (port 8088, database directory_db). Replaces: PRVDIR01. Contract-first; status DRAFT until Phase 3 approval,
    then 1.0.0. 1.1.0 (2026-11-19, user decision): adds GET /api/v1/batch/directory-extracts/{runId} (run status, BatchRun) so the batch jobs page can follow a run to COMPLETED or FAILED; additive.'
  license:
    name: Proprietary
    identifier: LicenseRef-PEM-Proprietary
servers:
- url: http://api-gateway:8080
  description: 'API gateway on the docker compose network (from the host: http://localhost:8080)'
tags:
- name: Directory
  description: Public provider directory
- name: FHIR
  description: FHIR R4 read-only API
- name: Legacy files
  description: Fixed-width legacy files kept for parity (MODERNIZATION.md rule 3)
paths:
  /api/v1/directory/providers:
    get:
      operationId: searchDirectory
      summary: Public search of active providers
      tags:
      - Directory
      description: 'Roles: PUBLIC. Legacy / decisions: PRVDIR01; Q-008.'
      x-roles:
      - PUBLIC
      x-legacy: PRVDIR01; Q-008
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Name contains
      - name: providerType
        in: query
        required: false
        schema:
          type: string
          enum:
          - IN
          - GR
          - FA
        description: Type
      - name: taxonomy
        in: query
        required: false
        schema:
          type: string
        description: Taxonomy
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Page number (0-based)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: Page size
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryPage'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /fhir/Practitioner:
    get:
      operationId: searchPractitioners
      summary: FHIR R4 Practitioner search (individual providers)
      tags:
      - FHIR
      description: 'Roles: PUBLIC. Legacy / decisions: ADR-006.'
      x-roles:
      - PUBLIC
      x-legacy: ADR-006
      parameters:
      - name: identifier
        in: query
        required: false
        schema:
          type: string
        description: NPI as system|value
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Name
      security: []
      responses:
        '200':
          description: FHIR searchset Bundle
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirBundle'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /fhir/Organization:
    get:
      operationId: searchOrganizations
      summary: FHIR R4 Organization search (groups and facilities)
      tags:
      - FHIR
      description: 'Roles: PUBLIC. Legacy / decisions: ADR-006.'
      x-roles:
      - PUBLIC
      x-legacy: ADR-006
      parameters:
      - name: identifier
        in: query
        required: false
        schema:
          type: string
        description: NPI as system|value
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Name
      security: []
      responses:
        '200':
          description: FHIR searchset Bundle
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirBundle'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /fhir/PractitionerRole:
    get:
      operationId: searchPractitionerRoles
      summary: FHIR R4 PractitionerRole search (specialty = taxonomy)
      tags:
      - FHIR
      description: 'Roles: PUBLIC. Legacy / decisions: ADR-006.'
      x-roles:
      - PUBLIC
      x-legacy: ADR-006
      parameters:
      - name: specialty
        in: query
        required: false
        schema:
          type: string
        description: Taxonomy code
      security: []
      responses:
        '200':
          description: FHIR searchset Bundle
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/FhirBundle'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/batch/directory-extracts:
    post:
      operationId: startDirectoryExtract
      summary: Produce the nightly MCO directory file for a business date
      tags:
      - Legacy files
      description: 'Roles: ADMIN, SYSTEM. Legacy / decisions: PRVDIR01.'
      x-roles: &id001
      - ADMIN
      - SYSTEM
      x-legacy: PRVDIR01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRunRequest'
      security:
      - bearerAuth: *id001
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRun'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/batch/directory-extracts/{runId}:
    get:
      operationId: getDirectoryExtract
      summary: Get a directory extract run with its status, counts and failure reason
      tags:
      - Legacy files
      description: 'Roles: ADMIN. Legacy / decisions: PRVDIR01 counters (MAM-67). Added in 1.1.0 (user decision 2026-11-19): run status for the batch jobs page (MAM-93).'
      x-roles:
      - ADMIN
      x-legacy: PRVDIR01 counters (MAM-67)
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Run id
      security:
      - bearerAuth:
        - ADMIN
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRun'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/batch/directory-extracts/{runId}/file:
    get:
      operationId: getDirectoryExtractFile
      summary: Download the DIROUT file of a run (100-byte records)
      tags:
      - Legacy files
      description: 'Roles: ADMIN. Legacy / decisions: DIROUT; D-028.'
      x-roles: &id002
      - ADMIN
      x-legacy: DIROUT; D-028
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Run id
      security:
      - bearerAuth: *id002
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                description: 100-byte DIROUT records
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak realm pem access token. Role names in each operation's security requirement are realm roles (OpenAPI 3.1 allows role
        lists for non-OAuth schemes).
  schemas:
    BatchRun:
      type: object
      required:
      - runId
      - job
      - businessDate
      - status
      properties:
        runId:
          type: string
          format: uuid
        job:
          type: string
        businessDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - FAILED
        counts:
          type: object
          additionalProperties:
            type: integer
        error:
          type:
          - string
          - 'null'
          description: Why the run failed (D-024)
        startedAt:
          type: string
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
    BatchRunRequest:
      type: object
      required:
      - businessDate
      properties:
        businessDate:
          type: string
          format: date
          description: Explicit business date (D-020)
    DirectoryEntry:
      type: object
      required:
      - npi
      - providerType
      - displayName
      properties:
        npi:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
        medicaidId:
          type: string
        providerType:
          type: string
          enum:
          - IN
          - GR
          - FA
        riskTier:
          type:
          - string
          - 'null'
          enum:
          - L
          - M
          - H
          - null
        displayName:
          type: string
          maxLength: 60
          description: Composed from the name fields (D-028)
        taxonomy:
          type: string
    DirectoryPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    FhirBundle:
      type: object
      required:
      - resourceType
      description: FHIR R4 Bundle (searchset) of Plan-Net style resources
      properties:
        resourceType:
          type: string
          const: Bundle
        type:
          type: string
          const: searchset
        total:
          type: integer
        entry:
          type: array
          items:
            type: object
    FieldError:
      type: object
      required:
      - code
      - field
      properties:
        code:
          type: string
          enum: &id003
          - E101
          - E102
          - E103
          - E104
          - E201
          - E202
          - E203
          - E204
          - E205
        field:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 7807 problem details. `code` carries a legacy error code (E101-E205) where one applies (D-016).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: *id003
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
