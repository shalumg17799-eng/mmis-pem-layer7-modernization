openapi: 3.1.0
info:
  title: PEM notification-service API
  version: 1.0.0
  description: 'notification-service (port 8087, database notification_db). Replaces: PRVNT* (missing programs). Contract-first; status DRAFT
    until Phase 3 approval, then 1.0.0.'
  license:
    name: Proprietary
    identifier: LicenseRef-PEM-Proprietary
servers:
- url: http://api-gateway:8080
  description: 'API gateway on the docker compose network (from the host: http://localhost:8080)'
tags:
- name: Notices
  description: Notices to providers
paths:
  /api/v1/notices:
    get:
      operationId: listNotices
      summary: List notices sent (a PROVIDER sees only their own)
      tags:
      - Notices
      description: 'Roles: PROVIDER, ANALYST, SUPERVISOR, ADMIN. Legacy / decisions: PRVNT*; D-012.'
      x-roles: &id001
      - PROVIDER
      - ANALYST
      - SUPERVISOR
      - ADMIN
      x-legacy: PRVNT*; D-012
      parameters:
      - name: npi
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
        description: NPI
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Page number (0-based)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        description: Page size
      security:
      - bearerAuth: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticePage'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/notice-templates:
    get:
      operationId: listNoticeTemplates
      summary: List notice templates
      tags:
      - Notices
      description: 'Roles: ADMIN. Legacy / decisions: PRVNTTRM/SUS/RST/GEN.'
      x-roles: &id002
      - ADMIN
      x-legacy: PRVNTTRM/SUS/RST/GEN
      security:
      - bearerAuth: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeTemplateList'
        '401':
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak realm pem access token. Role names in each operation's security requirement are realm roles (OpenAPI 3.1 allows role
        lists for non-OAuth schemes).
  schemas:
    FieldError:
      type: object
      required:
      - code
      - field
      properties:
        code:
          type: string
          enum: &id003
          - E101
          - E102
          - E103
          - E104
          - E201
          - E202
          - E203
          - E204
          - E205
        field:
          type: string
        message:
          type: string
    Notice:
      type: object
      required:
      - noticeId
      - npi
      - template
      - status
      properties:
        noticeId:
          type: string
          format: uuid
        npi:
          type: string
          pattern: ^[0-9]{10}$
          description: National Provider Identifier (10 digits), the provider key
          examples:
          - '1003000111'
        template:
          type: string
          enum:
          - TRM
          - SUS
          - RST
          - GEN
          - APPROVED
          - DENIED
          - REJECTED
          - REVALIDATION_DUE
          - EXTRACT_READY
        channel:
          type: string
          enum:
          - EMAIL
        status:
          type: string
          enum:
          - SENT
          - FAILED
        sentAt:
          type: string
          format: date-time
    NoticePage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    NoticeTemplate:
      type: object
      required:
      - code
      - subject
      properties:
        code:
          type: string
        subject:
          type: string
        body:
          type: string
    NoticeTemplateList:
      type: array
      items:
        $ref: '#/components/schemas/NoticeTemplate'
    Problem:
      type: object
      description: RFC 7807 problem details. `code` carries a legacy error code (E101-E205) where one applies (D-016).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: *id003
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
