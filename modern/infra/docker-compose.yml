# PEM local stack (java-microservices 3; ADR-011). Started by `make up` (or ./pem.sh up) from modern/.
# Secrets come from infra/.env.local (random, local only, git-ignored; created by infra/scripts/gen-env-local.sh).
# Every image is pinned (tag + digest). Memory limits keep the stack small: this machine shares Docker with other projects.
name: pem

x-defaults: &defaults
  restart: unless-stopped
  env_file: [.env.local]

services:
  postgres:
    <<: *defaults
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_USER: pem_admin
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?run infra/scripts/gen-env-local.sh}
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=150", "-c", "work_mem=2MB",
              "-c", "maintenance_work_mem=16MB", "-c", "effective_cache_size=128MB", "-c", "wal_buffers=1MB"]
    ports: ["${PEM_PG_HOST_PORT:-5433}:5432"]   # host 5432 is taken by a native Postgres on this machine
    volumes:
      - pem-pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pem_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  kafka:
    <<: *defaults
    image: apache/kafka-native:4.3.2@sha256:7c4fd2ffcbd9b468a7c672c772d355b8d5138bc76697ae5dd71c18f6bcffad10
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      # This machine is short of CPU and memory: with the default 2 s heartbeat and 9 s session the controller fenced
      # the broker, its __consumer_offsets partitions went offline and consumer groups could not form (2026-11-19).
      KAFKA_BROKER_HEARTBEAT_INTERVAL_MS: 5000
      KAFKA_BROKER_SESSION_TIMEOUT_MS: 60000
    ports: ["9092:9092"]
    volumes: [pem-kafka:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 384m

  keycloak:
    <<: *defaults
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    command: ["start-dev", "--import-realm", "--http-port=8180", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: http://localhost:8180          # tokens carry iss=http://localhost:8180/realms/pem everywhere
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"     # services fetch keys at http://keycloak:8180
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx288m -XX:MaxMetaspaceSize=176m"
    ports: ["8180:8180"]
    volumes:
      - ./keycloak/realm-pem.json:/opt/keycloak/data/import/realm-pem.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
    mem_limit: 600m

  wiremock:
    <<: *defaults
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    command: ["--port", "8280", "--global-response-templating", "--disable-banner", "--max-request-journal", "2000"]
    environment:
      JAVA_OPTS: "-Xms32m -Xmx96m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
    ports: ["8280:8280"]
    volumes: ["./wiremock:/home/wiremock:ro"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8280/__admin/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 192m

  mailpit:
    <<: *defaults
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports: ["8025:8025", "1025:1025"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8025/livez || nc -z localhost 1025"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 48m

  # All nine services and the gateway in one JVM, each with its own Spring context, port and database (ADR-011).
  pem-apps:
    <<: *defaults
    profiles: [apps]
    image: maven:3.9-eclipse-temurin-21@sha256:8f6ac126f7810bb5549c4cd122d2bf0e9cda5bdeb0838aa928f09e779fd8bef8
    working_dir: /apps
    command: ["java", "-Xss512k", "-Xms160m", "-Xmx512m", "-XX:MaxMetaspaceSize=288m", "-XX:ReservedCodeCacheSize=80m",
              "-XX:+UseSerialGC", "-XX:TieredStopAtLevel=1", "-XX:+ExitOnOutOfMemoryError", "-Duser.timezone=UTC",
              "-jar", "/apps/pem-local-runtime.jar"]
    environment:
      PEM_DB_HOST: postgres
      PEM_DB_PORT: "5432"
      PEM_KAFKA_BOOTSTRAP: kafka:29092
      PEM_JWT_ISSUER: http://localhost:8180/realms/pem
      PEM_JWKS_URI: http://keycloak:8180/realms/pem/protocol/openid-connect/certs
      PEM_TOKEN_URI: http://keycloak:8180/realms/pem/protocol/openid-connect/token
      PEM_SOURCES_URL: http://wiremock:8280
      PEM_SMTP_HOST: mailpit
      PEM_SMTP_PORT: "1025"
      PEM_SERVICE_HOST: localhost                 # every service is in this JVM
      PEM_CORS_ORIGINS: http://localhost:5173
    volumes: ["./local-runtime/build/libs:/apps:ro"]
    ports: ["8080:8080", "${PEM_PROVIDER_HOST_PORT:-18081}:8081", "8082-8089:8082-8089"]   # host 8081 is taken on this machine
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      wiremock: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "for p in 8080 8081 8082 8083 8084 8085 8086 8087 8088 8089; do curl -sf http://localhost:$$p/actuator/health/readiness > /dev/null || exit 1; done"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 90s
    mem_limit: 1024m

  web-ui:
    <<: *defaults
    profiles: [apps]
    image: nginx:1.31.2-alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    volumes:
      - ../web-ui/dist:/usr/share/nginx/html:ro
      - ./nginx/web-ui.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["5173:80"]
    depends_on:
      pem-apps: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 32m

  # MAM-88 load generator of the performance smoke. Profile "perf": no normal command starts it (./pem.sh up and the e2e use
  # --profile apps only) and it has no depends_on, so running it never starts, recreates or restarts another service.
  # Started only by modern/tools/perf/run_perf_smoke.py, always as
  #   docker compose --project-name pem --env-file infra/.env.local -f infra/docker-compose.yml --profile perf run --rm --no-deps -T k6 run /scripts/<script>.js
  # It joins the compose network and calls the gateway by its service name (BASE_URL), not through host.docker.internal: the traffic then
  # stays inside Docker (no Docker Desktop host port forwarder in the measurement), it needs no extra_hosts entry on Linux CI, and it does
  # not depend on host.docker.internal resolving. The ANALYST token is passed through from the runner's environment (never written here).
  k6:
    profiles: [perf]
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
    entrypoint: ["k6"]
    command: ["version"]
    restart: "no"
    environment:
      - K6_NO_USAGE_REPORT=true     # k6 sends an anonymous usage report by default: off
      - BASE_URL=http://pem-apps:8080
      - ANALYST_TOKEN               # no value here: taken from the environment of the docker compose process, if set
    volumes:
      - ../tools/perf/k6:/scripts:ro      # the k6 scripts, read-only
      - ../tools/perf/out:/out            # runner-written inputs (npis.json) and the summaries k6 exports (git-ignored folder)
    mem_limit: 512m

volumes:
  pem-pgdata:
  pem-kafka:
