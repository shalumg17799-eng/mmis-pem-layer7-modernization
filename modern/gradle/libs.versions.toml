# Every version used by the PEM build (ADR-010). Spring Boot manages the versions of its own starters and of
# Kafka, Flyway, Hibernate, Testcontainers, JUnit, AssertJ and Mockito through its BOM.
[versions]
java = "21"
spring-boot = "3.5.16"          # latest 3.x GA on 2026-11-18
spring-cloud = "2025.0.3"       # release train for Spring Boot 3.5
springdoc = "2.8.17"
cucumber = "7.34.9"
wiremock = "3.13.2"
hapi-fhir = "8.12.1"            # latest 8.x on 2026-11-19; directory-service tests only (MAM-65 AC-7)
archunit = "1.5.1"
pitest = "1.20.4"
pitest-junit5 = "1.2.3"
pitest-plugin = "1.15.0"
spotless = "7.2.1"
jacoco = "0.8.13"
# MAM-84 AC-5, Q-122: security fixes on top of the Spring Boot 3.5.16 BOM. The BOM, or a starter, brings these run-time
# libraries in an older patch or minor version of the same line; pem.java-conventions applies each one (the higher wins).
tomcat = "10.1.59"              # BOM 10.1.55; 5 CRITICAL, 1 HIGH, 1 MODERATE advisories (GHSA-f525-44xv-f2qj and 6 more)
jackson = "2.21.7"              # BOM 2.21.4; 5 HIGH, 6 MODERATE advisories; the jackson-bom keeps every Jackson module on one version
postgresql-jdbc = "42.7.12"     # BOM 42.7.11; GHSA-j92g-9f8w-j867 (HIGH, channel-binding downgrade)
snappy-java = "1.1.10.9"        # Kafka brings 1.1.10.5; 2 HIGH, 1 MODERATE advisories
lz4-java = "1.11.4"             # Kafka brings 1.10.1; 1 HIGH, 4 MODERATE, 1 LOW advisories
bouncycastle = "1.85"           # spring-cloud-starter brings bcprov-jdk18on 1.80.2; 1 CRITICAL, 1 HIGH advisories
log4j = "2.25.5"                # BOM 2.24.3; GHSA-qv9r-c865-cp47 (MODERATE); log4j-api and log4j-to-slf4j on one version
httpclient5 = "5.6.5"           # BOM 5.5.2; GHSA-hjcp-jmpx-g3qm (MODERATE, fixed in 5.6.3); declared by the api-gateway only (ADR-013), but on the class path of pem-local-runtime.jar, which contains the gateway; 5.5.x has no fix
httpcore5 = "5.4.4"             # BOM 5.3.6; GHSA-hf6x-8p5f-cgmf and GHSA-v3jc-474w-2wm6 (both HIGH, fixed in 5.4.3); httpcore5 and httpcore5-h2 on one version; the 5.3 line has no fix

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
cucumber-bom = { module = "io.cucumber:cucumber-bom", version.ref = "cucumber" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
springdoc-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
pitest-junit5 = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5" }
hapi-fhir-structures-r4 = { module = "ca.uhn.hapi.fhir:hapi-fhir-structures-r4", version.ref = "hapi-fhir" }
hapi-fhir-validation = { module = "ca.uhn.hapi.fhir:hapi-fhir-validation", version.ref = "hapi-fhir" }
hapi-fhir-validation-resources-r4 = { module = "ca.uhn.hapi.fhir:hapi-fhir-validation-resources-r4", version.ref = "hapi-fhir" }
hapi-fhir-caching-caffeine = { module = "ca.uhn.hapi.fhir:hapi-fhir-caching-caffeine", version.ref = "hapi-fhir" }

# Run-time libraries raised above the Spring Boot BOM (MAM-84 AC-5, Q-122); constraints in pem.java-conventions
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
postgresql-driver = { module = "org.postgresql:postgresql", version.ref = "postgresql-jdbc" }
snappy-java = { module = "org.xerial.snappy:snappy-java", version.ref = "snappy-java" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4-java" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version.ref = "log4j" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
httpcore5 = { module = "org.apache.httpcomponents.core5:httpcore5", version.ref = "httpcore5" }
httpcore5-h2 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version.ref = "httpcore5" }

# Gradle plugins, used as buildSrc dependencies
spring-boot-gradle = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
pitest-gradle = { module = "info.solidsoft.gradle.pitest:gradle-pitest-plugin", version.ref = "pitest-plugin" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
