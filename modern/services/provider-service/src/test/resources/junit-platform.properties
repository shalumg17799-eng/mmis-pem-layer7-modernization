# A test or a test lifecycle method that runs longer than this fails with a timeout instead of hanging the build
# (lane rule of 2026-11-20: every waiting test is time-guarded). The longest test, ProviderOutageTest, needs about 150 s.
junit.jupiter.execution.timeout.testable.method.default = 6 m
junit.jupiter.execution.timeout.lifecycle.method.default = 6 m
