spring:
  application:
    name: api-gateway
  config:
    import: classpath:pem-common.yml
  # MAM-29 AC-6 / D-024: every call the gateway forwards has a limit, so a service that accepts the call and never answers
  # is answered with the 503 problem and does not hold the caller for ever. The read limit is the longest wait for the
  # response headers and then for each next piece of the body; it is not a limit on the whole transfer, so an export or
  # file download that keeps flowing is not cut off, and one that stalls ends after the limit. That needs Apache HttpClient 5
  # (ADR-013, set up in GatewayHttpClient): the JDK factory, which Spring Cloud Gateway picks by default, limits the WHOLE
  # exchange (Spring 6.2.19) and would cut a long download; the simple (HttpURLConnection) factory loses a service's 401 to a
  # POST, PUT or DELETE (HttpRetryException when the body is streamed) and knows no PATCH. Default 30 s = six times the 5 s
  # limit of a service's own calls (ServiceClients.DEFAULT_READ_TIMEOUT); the longest synchronous calls are the master export
  # and the file downloads (every batch run is answered 202 at once). Set PEM_GATEWAY_READ_TIMEOUT (a duration such as 45s)
  # to change it.
  http:
    client:
      factory: http-components
      connect-timeout: 2s
      read-timeout: ${PEM_GATEWAY_READ_TIMEOUT:30s}
  mvc:
    problemdetails:
      enabled: true
  # The gateway has no database, Kafka, batch or token checks of its own (it relays the token). These exclusions matter
  # in the local run mode (ADR-011), where the libraries of every service share one class path.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
server:
  port: ${PEM_GATEWAY_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
pem:
  security:
    enabled: false
  outbox:
    enabled: false
  gateway:
    cors-origins: ${PEM_CORS_ORIGINS:http://localhost:5173}
    services:
      provider: http://${PEM_SERVICE_HOST:localhost}:${PEM_PROVIDER_PORT:8081}
      enrollment: http://${PEM_SERVICE_HOST:localhost}:${PEM_ENROLLMENT_PORT:8082}
      screening: http://${PEM_SERVICE_HOST:localhost}:${PEM_SCREENING_PORT:8083}
      risk: http://${PEM_SERVICE_HOST:localhost}:${PEM_RISK_PORT:8084}
      revalidation: http://${PEM_SERVICE_HOST:localhost}:${PEM_REVALIDATION_PORT:8085}
      sanctions: http://${PEM_SERVICE_HOST:localhost}:${PEM_SANCTIONS_PORT:8086}
      notification: http://${PEM_SERVICE_HOST:localhost}:${PEM_NOTIFICATION_PORT:8087}
      directory: http://${PEM_SERVICE_HOST:localhost}:${PEM_DIRECTORY_PORT:8088}
      tmsis: http://${PEM_SERVICE_HOST:localhost}:${PEM_TMSIS_PORT:8089}
# MAM-84 AC-7 / Q-121: the gateway relays tokens and has no token check of its own, so it serves nothing of the actuator
# but health (the kit's pem-common.yml exposes health, info and metrics; an exclude always wins over that include).
management:
  endpoints:
    web:
      exposure:
        exclude: info,metrics
