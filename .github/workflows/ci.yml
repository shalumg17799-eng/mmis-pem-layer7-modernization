# MAM-39: CI pipeline for the PEM modernization (build and check, contract lint, web-ui tests, compose smoke test).
# ACTIVE since 2026-11-20 (user decision, 19:32): moved from modern/.github/workflows/, where it was inert on purpose
# (AC-6), to the repository root so that GitHub runs it (see modern/docs/runbooks/ci.md). Every action and tool is pinned
# to an exact version (AC-5). Synthetic data only; secrets are generated on the runner by infra/scripts/gen-env-local.sh.
name: pem-ci

on:
  push:
  pull_request:

defaults:
  run:
    # "shell: bash" makes GitHub run every step with "bash -eo pipefail". Without it the default is "bash -e", and a
    # step such as "gradlew ... | tee file" would report the exit code of tee: run 3 (commit c606832) showed the Gradle
    # job green after 31 seconds for exactly this reason.
    shell: bash
    working-directory: modern

jobs:
  build-and-check:
    name: Gradle build and full check
    runs-on: ubuntu-24.04
    # 150 minutes (was 90): the build is sequential and memory-bound on purpose (gradle.properties: no parallel build, two
    # workers), and the module checks with PIT add up to more than an hour on the development machine (provider-service
    # alone 9 minutes); a clean runner also downloads Gradle, the libraries and the Testcontainers images first.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21.0.7"
      # AC-1: unit, acceptance, integration, contract, ArchUnit, JaCoCo (85% per service) and PIT; any failure is red
      # --continue: every module is checked even when one fails, so one run shows every failure (the job is still red)
      - name: Build and check
        run: ./gradlew --no-daemon --continue build checkAll 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      # The job log needs a GitHub sign-in; annotations do not. On a failure the failed tasks, the first lines of each
      # "What went wrong" and the failed tests are written as error annotations (names and messages only, no log dump).
      - name: Failure summary (annotations)
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, re
          import xml.etree.ElementTree as ET
          NL = chr(10)
          esc = lambda s: s.replace('%', '%25').replace(chr(13), '').replace(NL, '%0A')[:6000]
          log = open(os.path.join(os.environ['RUNNER_TEMP'], 'gradle.log'), errors='replace').read()
          tasks = re.findall(r'^> Task (\S+) FAILED', log, re.M)
          print('::error title=Failed Gradle tasks (%d)::%s' % (len(tasks), esc(NL.join(tasks) or 'none found in the log')))
          for i, w in enumerate(re.findall(r'\* What went wrong:\n((?:.+\n){1,14})', log)[:5]):
              print('::error title=What went wrong %d::%s' % (i + 1, esc(w)))
          failed = []
          for f in sorted(glob.glob('**/build/test-results/test/*.xml', recursive=True)):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              for tc in root.iter('testcase'):
                  node = tc.find('failure') if tc.find('failure') is not None else tc.find('error')
                  if node is not None:
                      failed.append('%s > %s: %s' % (tc.get('classname', '').split('.')[-1], tc.get('name', '')[:120], (node.get('message') or '')[:160].replace(NL, ' ')))
          print('::error title=Failed tests (%d)::%s' % (len(failed), esc(NL.join(failed[:40]) or 'none in the JUnit XML files')))
          PY

  contract-lint:
    name: Contract lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "20.19.2"
      # AC-2: all OpenAPI files and the AsyncAPI file; an error in any of them fails the step
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1.34.3 lint contracts/openapi/*.yaml
      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@2.14.0 validate contracts/asyncapi/events.yaml
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12.10"
      - name: Contract consistency (roles, events, rule and field coverage)
        working-directory: .
        run: |
          python -m pip install --quiet pyyaml==6.0.2
          python modern/tools/checks/check_phase3.py

  web-ui:
    name: Web UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22.22.2"
      # AC-3: npm test fails on a failing test and, through scripts/no-skipped.mjs, on a skipped one
      # Node 22.22.2 (2026-11-20, first CI run): vitest, jsdom and other test packages of the lock file need Node 22;
      # on Node 20.19.2 the job failed in 18 seconds
      - name: Install and test
        working-directory: modern/web-ui
        run: |
          npm ci --no-audit --no-fund
          npm run -s lint 2>&1 | tee "$RUNNER_TEMP/lint.log"
          npm test
      - name: Failure summary (annotations)
        if: failure()
        working-directory: modern/web-ui
        run: |
          python3 - <<'PY'
          import json, os
          NL = chr(10)
          esc = lambda s: s.replace('%', '%25').replace(chr(13), '').replace(NL, '%0A')[:6000]
          path = 'test-results/vitest.json'
          lint = os.path.join(os.environ.get('RUNNER_TEMP', ''), 'lint.log')
          lint_text = open(lint, errors='replace').read().strip() if os.path.exists(lint) else None
          if lint_text is None:
              print('::error title=Web UI install::npm ci did not finish (no lint output exists)')
          elif lint_text:
              print('::error title=Web UI lint::%s' % esc(NL.join(lint_text.split(NL)[:40])))
          if not os.path.exists(path):
              print('::error title=Web UI tests::no test-results/vitest.json: the tests did not start or did not write their result')
          else:
              data = json.load(open(path, encoding='utf-8'))
              failed = ['%s: %s' % (a.get('fullName', '')[:160], (a.get('failureMessages') or [''])[0].split(NL)[0][:160])
                        for f in data.get('testResults', []) for a in f.get('assertionResults', []) if a.get('status') != 'passed']
              print('::error title=Web UI tests not passed (%d of %d)::%s' % (len(failed), data.get('numTotalTests', 0), esc(NL.join(failed[:40]) or 'none listed')))
          PY

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build-and-check]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21.0.7"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22.22.2"
      # AC-4: make up (pem.sh up waits until every container is healthy), the gateway health, the walking-skeleton
      # provider lookup, then make down; the logs of any container that is not healthy are printed on failure
      - name: Start the stack
        run: make up
      - name: Gateway health and provider lookup
        run: |
          curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          bash infra/scripts/seed.sh
          set -a; . infra/.env.local; set +a
          TOKEN=$(curl -sf -X POST http://localhost:8180/realms/pem/protocol/openid-connect/token \
            -d grant_type=password -d client_id=pem-test -d username=analyst1 \
            --data-urlencode "password=${KC_ANALYST_PASSWORD}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -sf http://localhost:8080/api/v1/providers/1005940865 -H "Authorization: Bearer ${TOKEN}" \
            | grep -q '"npi":"1005940865"'
      - name: Logs of containers that are not healthy
        if: failure()
        run: |
          for c in $(docker ps -a --filter label=com.docker.compose.project=pem --format '{{.Names}}'); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$c")
            if [ "$status" != "healthy" ]; then echo "=== $c ($status)"; docker logs --tail 200 "$c"; fi
          done
          # names and states only as an annotation (readable without a sign-in); the logs stay in the job log
          echo "::error title=Compose smoke test::$(docker ps -a --filter label=com.docker.compose.project=pem --format '{{.Names}}={{.Status}}' | tr '\n' ' ' | cut -c1-900)"
      - name: Stop the stack
        if: always()
        run: make down
